name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify installation
        run: flutter doctor -v

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Prefer Secrets if configured; fall back to embedded keystore
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️  No KEYSTORE_BASE64 secret found, using embedded keystore"
            cat <<'KEYSTORE_EOF' > /tmp/release.jks.b64
          
          KEYSTORE_EOF
            base64 -d /tmp/release.jks.b64 > android/app/release.jks
            KEYSTORE_PASSWORD_VAL="Octopus2024!"
            KEY_PASSWORD_VAL="Octopus2024!"
          else
            echo "✅ Using keystore from Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            KEYSTORE_PASSWORD_VAL="$KEYSTORE_PASSWORD"
            KEY_PASSWORD_VAL="$KEY_PASSWORD"
          fi

          # Validate keystore file
          if [ ! -s android/app/release.jks ]; then
            echo "❌ ERROR: release.jks is empty or missing!"
            exit 1
          fi
          echo "✅ Keystore size: $(wc -c < android/app/release.jks) bytes"

          # Write key.properties (use printf to avoid shell expansion issues)
          printf 'storePassword=%s\nkeyAlias=release\nkeyPassword=%s\nstoreFile=release.jks\n' \
            "$KEYSTORE_PASSWORD_VAL" "$KEY_PASSWORD_VAL" > android/key.properties

          echo "✅ key.properties created"
          cat android/key.properties | sed 's/=.*/=***/'

      - name: Build APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }}

      - name: Verify APK signature
        run: |
          echo "=== APK Signature Info ==="
          $ANDROID_HOME/build-tools/*/apksigner verify --print-cert build/app/outputs/flutter-apk/app-release.apk || true
          echo "=== Keystore Certificate ==="
          keytool -list -v -keystore android/app/release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD || 'Octopus2024!' }}" -alias release 2>&1 | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./artifacts/web/

      - name: Package Web build
        run: |
          cd ./artifacts/web && zip -r ../web-build.zip . && cd ..
          ls -la *.apk *.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 📦 下载说明

            ### Android
            下载 `app-release.apk` 安装即可。签名固定，可覆盖升级。

            ### Web
            下载 `web-build.zip` 解压后部署到任意静态服务器。

            ---
          files: |
            ./artifacts/app-release.apk
            ./artifacts/web-build.zip
