name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Setup signing keystore (Secrets only)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Hard requirement: keystore MUST come from Secrets, no embedded fallback
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "❌ ERROR: missing one of KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_PASSWORD/KEY_ALIAS in repo Secrets"
            echo "Please configure them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          if [ ! -s android/app/release.jks ]; then
            echo "❌ ERROR: release.jks is empty after decode"
            exit 1
          fi
          echo "✅ Keystore size: $(wc -c < android/app/release.jks) bytes"

          # key.properties: alias is parameterized, passwords are masked in logs
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreFile=release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/app/release.jks android/key.properties
          echo "✅ key.properties created (alias=$KEY_ALIAS)"

      - name: Build APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }}

      - name: Verify APK signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "=== APK Signature Info ==="
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apk-cert.txt
          echo
          echo "=== Keystore Certificate (should match APK signer) ==="
          keytool -list -v -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1 | head -30
          echo
          echo "=== Sanity check: ensure cert in APK matches cert in keystore ==="
          KEYSTORE_SHA1=$(keytool -list -v -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep "SHA1:" | awk '{print $2}')
          APK_SHA1=$(grep -oE "SHA-1 digest: [a-f0-9:]+" /tmp/apk-cert.txt | awk '{print $3}')
          echo "Keystore SHA1: $KEYSTORE_SHA1"
          echo "APK     SHA1: $APK_SHA1"
          if [ "$KEYSTORE_SHA1" != "$APK_SHA1" ]; then
            echo "❌ ERROR: APK signer SHA1 does not match keystore cert SHA1"
            exit 1
          fi
          echo "✅ Signature verified"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./artifacts/web/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 📦 下载说明

            ### Android
            下载 `app-release.apk` 安装即可。本 release 由仓库 owner 私钥签名，签名固定，可覆盖升级。

            ### Web
            下载 `web-build.zip` 解压后部署到任意静态服务器。

            ---
          files: |
            ./artifacts/app-release.apk
            ./artifacts/web/web-build.zip
